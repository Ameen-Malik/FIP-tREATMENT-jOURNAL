<!doctype html>
<html>
<head><meta charset="utf-8"><title>Legacy data export</title></head>
<body style="font-family:monospace;white-space:pre-wrap;word-break:break-all;padding:16px;font-size:12px;">
<script>
  const dump = {
    activeCatId: localStorage.getItem('fip_active_cat_id'),
    cats: JSON.parse(localStorage.getItem('fip_cats') || 'null'),
    logs: JSON.parse(localStorage.getItem('fip_logs') || 'null'),
    legacy_name: localStorage.getItem('fip_n'),
    legacy_logs: JSON.parse(localStorage.getItem('fip_l3') || 'null'),
    legacy_proto: JSON.parse(localStorage.getItem('fip_p2') || 'null'),
  };
  document.body.textContent = JSON.stringify(dump, null, 2);
</script>
</body>
</html>
